name: CI Pipeline

on:
  push:
    branches: [ "develop", "release", "production" ]
  pull_request:
    branches: [ "develop", "release", "production" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Basic HTML Linting check
        run: echo "Linting HTML/CSS..." 
        
      - name: Build Docker Image Test
        run: docker build -t test-build .